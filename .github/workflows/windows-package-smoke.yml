name: Windows package smoke

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/

jobs:
  package-smoke:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm 10.10.0
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and type checks
        shell: pwsh
        run: |
          pnpm exec vitest run
          pnpm exec tsc --noEmit -p tsconfig.node.json --composite false
          pnpm exec tsc --noEmit -p tsconfig.web.json --composite false

      - name: Build unpacked Windows application
        shell: pwsh
        run: |
          pnpm exec electron-vite build
          pnpm exec electron-builder --win --x64 --dir --publish never

      - name: Verify packaged runtime closure
        run: node scripts/verify-packaged-runtime.mjs --expected-version 1.0.5

      - name: Build NSIS installer
        run: pnpm exec electron-builder --win nsis --x64 --publish never

      - name: Test NSIS archive integrity
        shell: pwsh
        run: 7z t ./dist/AnjuJianye-PPT-Assistant-1.0.5-x64-setup.exe

      - name: Smoke install, launch twice, and uninstall
        shell: pwsh
        run: |
          ./scripts/windows-package-smoke.ps1 `
            -InstallerPath ./dist/AnjuJianye-PPT-Assistant-1.0.5-x64-setup.exe `
            -ExpectedVersion 1.0.5

      - name: Record installer SHA-256
        shell: pwsh
        run: |
          Get-FileHash `
            ./dist/AnjuJianye-PPT-Assistant-1.0.5-x64-setup.exe `
            -Algorithm SHA256 |
            Format-List |
            Out-File ./dist/AnjuJianye-PPT-Assistant-1.0.5-x64-setup.sha256.txt

      - name: Upload test-only candidate
        uses: actions/upload-artifact@v4
        with:
          name: AnjuJianye-PPT-Assistant-1.0.5-windows-smoke
          if-no-files-found: error
          path: |
            dist/AnjuJianye-PPT-Assistant-1.0.5-x64-setup.exe
            dist/AnjuJianye-PPT-Assistant-1.0.5-x64-setup.sha256.txt
          retention-days: 7
