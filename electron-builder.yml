appId: com.szajjy.pptassistant
productName: 安居建业PPT助手
directories:
  buildResources: build
files:
  - '!**/.DS_Store'
  - '!**/._*'
  # MP4 export is outside the internal product scope; ffmpeg is excluded and
  # build/after-pack.cjs defensively removes any unpacked copy.
  - '!resources/ffmpeg/**'
  # Only the corporate style package is shipped. Keep the style manifest and
  # anjian-corporate, but omit every other style directory from app.asar too.
  - '!resources/styles/!(anjian-corporate)/**'
  # The Windows candidate must not carry optional native binaries for other
  # operating systems or CPU architectures.
  - '!node_modules/@napi-rs/canvas-android-*/**'
  - '!node_modules/@napi-rs/canvas-darwin-*/**'
  - '!node_modules/@napi-rs/canvas-linux-*/**'
  - '!node_modules/@napi-rs/canvas-win32-arm64-msvc/**'
  - '!node_modules/@node-rs/jieba-android-*/**'
  - '!node_modules/@node-rs/jieba-darwin-*/**'
  - '!node_modules/@node-rs/jieba-freebsd-*/**'
  - '!node_modules/@node-rs/jieba-linux-*/**'
  - '!node_modules/@node-rs/jieba-wasm32-*/**'
  - '!node_modules/@node-rs/jieba-win32-arm64-msvc/**'
  - '!node_modules/@node-rs/jieba-win32-ia32-msvc/**'
  - '!node_modules/@libsql/darwin-*/**'
  - '!node_modules/@libsql/linux-*/**'
  - '!**/.vscode/*'
  - '!**/.idea/**'
  - '!**/.git/**'
  - '!src/**'
  - '!tools/**'
  - '!scripts/**'
  - '!assets/**'
  - '!docs/**'
  - '!doc/**'
  - '!logs/**'
  - '!patch/**'
  - '!tpack/**'
  - '!dist/**'
  - '!.claude/**'
  - '!.pnpm-store/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!README_*'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!**/*.map'
  - '!**/*.tsbuildinfo'
  - '!*.db'
  - '!*.db-*'
  - '!{ajjy-ppt.dev.db,ajjy-ppt.db}'
  - '!thumb.png'
  - '!tests/**'
  - '!test/**'
asarUnpack:
  - resources/**
  - node_modules/@node-rs/**/*.node
  - node_modules/@napi-rs/**/*.node
afterPack: build/after-pack.cjs
extraResources:
  - from: build/icons/icon.ico
    to: icons/icon.ico
  - from: build/icons/32x32.png
    to: icons/32x32.png
  - from: build/icons/16x16.png
    to: icons/16x16.png
forceCodeSigning: false
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: AnjuJianyePPT
  icon: build/icons/icon.ico
nsis:
  artifactName: AnjuJianye-PPT-Assistant-${version}-x64-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/icons/icon.ico
  uninstallerIcon: build/icons/icon.ico
  installerHeaderIcon: build/icons/icon.ico
  unicode: true
  warningsAsErrors: false
  runAfterFinish: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createStartMenuShortcut: true
  include: installer.nsh
npmRebuild: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
