<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>青瓷竹影</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{display:grid;place-items:center;background:#eef0d6;color:#1b1a18;font-family:Arial,"PingFang SC",sans-serif}.page{width:min(100vw,177.78vh);height:min(56.25vw,100vh);padding:6%;background:linear-gradient(135deg,#f3f1d5 0%,#eef0d6 58%,#9dcb95 100%);position:relative;overflow:hidden}.bamboo{position:absolute;right:7%;top:-4%;height:112%;width:12%;border-left:20px solid #6faf82;border-right:6px solid #9dcb95;opacity:.7}.bamboo:before{content:"";position:absolute;left:-37px;top:20%;width:65px;height:22%;border-left:3px solid #2f7d91;transform:skewY(-30deg)}.seal{position:absolute;right:17%;bottom:12%;width:46px;height:46px;background:#b53a2d;color:#f3f1d5;display:grid;place-items:center;font:12px Georgia}.kicker{font:12px monospace;letter-spacing:3px;color:#2f7d91}.line{width:1px;height:14vh;background:#5da8a7;margin:5% 0}.copy{max-width:57%}h1{margin:0;font:clamp(48px,7vw,118px)/.95 Georgia,"Songti SC",serif;letter-spacing:3px}.copy p{font:clamp(14px,1.65vw,27px)/1.7 Georgia,"Songti SC",serif;max-width:21em}.verse{position:absolute;left:7%;bottom:10%;writing-mode:vertical-rl;font:15px/2 Georgia,"Songti SC",serif;letter-spacing:3px;color:#263238}.mist{position:absolute;right:17%;bottom:-9%;width:52%;height:28%;border-radius:50%;background:rgba(238,240,214,.7);filter:blur(10px)}
</style>
</head>
<body><main class="page"><div class="mist"></div><div class="bamboo"></div><div class="kicker">CELADON / CULTURAL NOTE</div><div class="line"></div><section class="copy"><h1>竹影入卷</h1><p>让一处留白，安放一段山水与一句题跋。</p></section><div class="verse">风来竹有声</div><div class="seal">雅</div></main></body>
</html>
